name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout conference data
        uses: actions/checkout@v4
        with:
          repository: ccfddl/ccf-deadlines
          path: .ccf-deadlines
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate conference map data
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3 geonamescache==3.0.2
          python scripts/sync_conferences.py --source .ccf-deadlines/conference
          rm -rf .ccf-deadlines

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
